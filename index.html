<script>
  // تم را قبل از نمایش صفحه تعیین می‌کنیم تا چشمک نزند
  (function () {
    var t = null;
    try { t = localStorage.getItem('vexon-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>

<style>
:root {
  --bg: #f3f7ff;
  --surface: rgba(255, 255, 255, .72);
  --solid: #ffffff;
  --fg: #0b1733;
  --muted: #5b6b8c;
  --accent: #1f5bdc;
  --accent-2: #14c4e8;
  --line: rgba(31, 91, 220, .14);
  --chip: #e8efff;
  --shadow: 0 14px 30px -16px rgba(20, 60, 160, .28);
  --glow1: rgba(20, 196, 232, .35);
  --glow2: rgba(31, 91, 220, .25);
  --sq: rgba(31, 91, 220, .09);
  --spot: rgba(255, 255, 255, .7);       /* نور روی کارت‌ها */
  /* شیشه‌ای */
  --glass: rgba(255, 255, 255, .42);
  --glass-line: rgba(255, 255, 255, .75);
  --glass-shine: rgba(255, 255, 255, .55);
  /* دکمه‌های شیشه‌ای */
  --btn-glass: linear-gradient(135deg, rgba(31, 91, 220, .62), rgba(20, 196, 232, .42));
  --btn-line: rgba(255, 255, 255, .55);
  --btn-text: #ffffff;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #07102a;
  --surface: rgba(14, 29, 68, .72);
  --solid: #0e1d44;
  --fg: #eef4ff;
  --muted: #9fb3d9;
  --accent: #3d7bff;
  --accent-2: #2fd8f5;
  --line: rgba(120, 160, 255, .16);
  --chip: #14295a;
  --shadow: 0 14px 30px -16px rgba(0, 0, 0, .6);
  --glow1: rgba(47, 216, 245, .22);
  --glow2: rgba(61, 123, 255, .25);
  --sq: rgba(255, 255, 255, .06);
  --spot: rgba(47, 216, 245, .18);
  --glass: rgba(255, 255, 255, .06);
  --glass-line: rgba(255, 255, 255, .16);
  --glass-shine: rgba(255, 255, 255, .12);
  --btn-glass: linear-gradient(135deg, rgba(61, 123, 255, .45), rgba(47, 216, 245, .25));
  --btn-line: rgba(255, 255, 255, .28);
  --btn-text: #ffffff;
  color-scheme: dark;
}

/* ===== پایه: اول برای گوشی ===== */
* { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overflow-x: hidden;
}
html, body { margin: 0; }
body {
  min-height: 100vh;
  font-family: "Mayon", "Rastin", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.7;
  color: var(--fg);
  background:
    linear-gradient(var(--sq) 1px, transparent 1px),
    linear-gradient(90deg, var(--sq) 1px, transparent 1px),
    radial-gradient(600px 360px at 92% -10%, var(--glow1), transparent 60%),
    radial-gradient(520px 360px at -10% 12%, var(--glow2), transparent 60%),
    var(--bg);
  background-size: 42px 42px, 42px 42px, auto, auto, auto;
  background-attachment: fixed;
  padding: 12px 12px 110px;
  overflow-x: hidden;
  transition: background-color .3s ease, color .3s ease;
}
.wrap { max-width: 980px; margin: 0 auto; }
img { max-width: 100%; display: block; }
button { font-family: inherit; }
[hidden] { display: none !important; }

/* ===== دکمه‌های شیشه‌ای (glassmorphism) ===== */
.cta, .buy, .sbtn, .dock .main, nav.tabs button[aria-pressed="true"] {
  background: var(--btn-glass);
  color: var(--btn-text);
  border: 1px solid var(--btn-line);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(255, 255, 255, .1),
              0 10px 24px -12px rgba(0, 0, 0, .45);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.cta:hover, .buy:hover, .sbtn:hover { filter: brightness(1.1); }
.slide .go {
  background: rgba(255, 255, 255, .24);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, .5);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 8px 20px -12px rgba(0, 0, 0, .45);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  text-decoration: none; font-weight: 700;
  padding: 8px 14px; border-radius: 999px; font-size: 13px;
}
[data-theme="light"] .slide .go { color: #0b1733; text-shadow: none; }

/* هدر */
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 4px 0 12px;
}
.brand-wrap { display: flex; align-items: center; min-width: 0; }

/* نام فروشگاه: همیشه در حال درخشیدن */
.brand {
  font-weight: 900; font-size: 18px; letter-spacing: .6px; white-space: nowrap;
  background: linear-gradient(90deg,
    var(--accent) 0%, var(--accent-2) 25%, #ffffff 50%, var(--accent-2) 75%, var(--accent) 100%);
  background-size: 250% auto;
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}
.brand span { color: inherit; -webkit-text-fill-color: transparent; }
@keyframes shine {
  from { background-position: 100% center; }
  to   { background-position: -150% center; }
}

.actions { display: flex; align-items: center; gap: 6px; flex: none; }
.iconbtn {
  width: 36px; height: 36px; border-radius: 12px; cursor: pointer;
  background: var(--glass); border: 1px solid var(--glass-line); color: var(--fg);
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  font-size: 16px; display: grid; place-items: center; padding: 0;
  box-shadow: inset 0 1px 0 var(--glass-shine);
}
.cta {
  text-decoration: none; padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: 12px;
  white-space: nowrap;
}

/* معرفی */
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  border-radius: 20px; padding: 20px 18px; margin: 2px 0 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; box-shadow: var(--shadow);
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, .14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .14) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-mask-image: linear-gradient(180deg, #000, transparent 90%);
          mask-image: linear-gradient(180deg, #000, transparent 90%);
}
.hero::after {
  content: ""; position: absolute; z-index: -1; width: 180px; height: 180px; border-radius: 50%;
  background: rgba(255, 255, 255, .14); left: -70px; top: -80px;
}
.hero h1 { margin: 0 0 6px; font-size: 20px; font-weight: 900; line-height: 1.5; text-wrap: balance; }
.hero p { margin: 0 0 12px; font-size: 13px; opacity: .93; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badges span {
  background: rgba(255, 255, 255, .2); padding: 3px 10px; border-radius: 999px; font-size: 11.5px;
}

/* اسلایدر */
.slider { margin: 0 0 16px; }
.slider > h2 { font-size: 15px; font-weight: 900; margin: 0 0 8px; }
/* touch-action: pan-y یعنی اسکرول عمودی صفحه کار کنه، ولی کشیدن افقی برای اسلایدر باشه */
.slides { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.slide {
  display: none; flex-direction: column; gap: 6px;
  border-radius: 20px; padding: 18px 16px;
  background:
    radial-gradient(120% 70% at 50% 0%, var(--spot), transparent 65%),
    linear-gradient(135deg, rgba(31, 91, 220, .6), rgba(20, 196, 232, .35));
  backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
  border: 1px solid var(--glass-line);
  box-shadow: 0 16px 36px -18px rgba(0, 0, 0, .45), inset 0 1px 0 var(--glass-shine);
  color: #fff;
}
[data-theme="light"] .slide { color: #0b1733; }
.slide.on { display: flex; animation: slideIn .6s ease both; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.slide .eyebrow { opacity: .8; font-size: 12px; }
.slide .t { font-size: 20px; font-weight: 900; line-height: 1.5; text-wrap: balance; }
.slide .d { opacity: .92; font-size: 13px; }
.slide .row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex-wrap: wrap; margin-top: 6px;
}
.slide .pr { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.slide .pr small { font-size: 11px; font-weight: 500; opacity: .85; }
.slide .old { opacity: .75; }

/* کنترل‌های اسلایدر: فلش‌ها و نقطه‌ها */
.ctrl { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; }
.arr {
  width: 38px; height: 38px; border-radius: 50%; cursor: pointer; flex: none;
  display: grid; place-items: center; padding: 0;
  background: var(--glass); border: 1px solid var(--glass-line); color: var(--fg);
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  box-shadow: inset 0 1px 0 var(--glass-shine), 0 8px 18px -10px rgba(0, 0, 0, .4);
  transition: transform .15s ease, background .2s ease;
}
.arr:active { transform: scale(.92); }
.arr svg { width: 16px; height: 16px; }
.dots { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dot {
  width: 9px; height: 9px; border-radius: 999px; border: 0; padding: 0; cursor: pointer;
  background: var(--line); transition: width .3s ease, background .3s ease;
}
.dot.on {
  width: 30px; background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

/* جستجو و تب‌ها */
.search {
  width: 100%; font: inherit; font-size: 14px; color: var(--fg); margin-bottom: 10px;
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px;
  padding: 10px 14px; outline: none;
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  box-shadow: inset 0 1px 0 var(--glass-shine);
}
.search:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--glow1); }
nav.tabs {
  display: flex; gap: 6px; margin: 0 0 14px;
  overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  flex: none; font: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer;
  background: var(--glass); color: var(--fg); border: 1px solid var(--glass-line);
  backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%);
  padding: 6px 12px; border-radius: 999px; transition: transform .15s ease;
}
nav.tabs button:active { transform: scale(.96); }
nav.tabs button[aria-pressed="true"] {
  padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
}
nav.tabs button:focus-visible, .iconbtn:focus-visible, .cta:focus-visible, .buy:focus-visible,
.sbtn:focus-visible, .arr:focus-visible, .dot:focus-visible, .slide .go:focus-visible {
  outline: 2px solid var(--accent-2); outline-offset: 2px;
}

/* بخش‌ها و کارت‌ها */
section.group { margin: 0 0 20px; }
section.group > h2 { font-size: 15px; font-weight: 900; margin: 0 0 2px; }
p.note { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
.grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
/* کارت شیشه‌ای با نور از بالا */
.card {
  position: relative; min-width: 0;
  display: flex; flex-direction: column; gap: 6px;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--spot), transparent 65%),
    linear-gradient(160deg, var(--glass-shine), var(--glass));
  border: 1px solid var(--glass-line); border-radius: 16px;
  padding: 14px 12px 12px;
  backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
  box-shadow: 0 12px 28px -14px rgba(0, 0, 0, .3), inset 0 1px 0 var(--glass-shine);
}
.card .title { font-weight: 700; font-size: 13.5px; line-height: 1.6; overflow-wrap: anywhere; }
.card .sub { color: var(--muted); font-size: 11.5px; }
.card .price {
  margin-top: auto; font-weight: 900; font-size: 15px; color: var(--accent);
  font-variant-numeric: tabular-nums; padding-top: 4px;
}
.card .price small { font-weight: 500; font-size: 11px; color: var(--muted); }
.old {
  font-size: 11.5px; font-weight: 500; color: var(--muted);

  position: absolute; top: 8px; left: 8px; font-size: 10.5px; font-weight: 700;

}
.buy {
  display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 12.5px;
  padding: 8px; border-radius: 11px;
}
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

/* فوتر */

}
footer.bottom a { color: var(--accent); font-weight: 700; text-decoration: none; }

/* نوار شناور پایین */
.dock {
  position: fixed; bottom: max(10px, env(safe-area-inset-bottom, 0px)); left: 50%;
  transform: translateX(-50%); width: min(560px, calc(100% - 20px));
  display: flex; justify-content: space-around; align-items: stretch; gap: 4px;
  padding: 5px; border-radius: 20px; z-index: 20;

  box-shadow: 0 16px 34px -14px rgba(0, 0, 0, .4), inset 0 1px 0 var(--glass-shine);

}
.dock a, .dock button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; text-decoration: none; cursor: pointer;
  font: inherit; font-size: 11px; font-weight: 700; line-height: 1.3;
  color: var(--muted); background: transparent; border: 1px solid transparent;
  padding: 6px 2px; border-radius: 14px; transition: background .15s ease; min-width: 0;
}
.dock a:hover, .dock button:hover { background: var(--chip); }
.dock .ico { font-size: 16px; }
.dock .main { flex: 1.3; border-radius: 14px; }

.dock a:focus-visible, .dock button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

/* پنل (مستطیل گرد وسط صفحه) */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 14px;
}
.sheet-bg {
  position: absolute; inset: 0; background: rgba(4, 10, 30, .5);

}
.sheet {
  position: relative; width: min(400px, 100%);

    radial-gradient(120% 50% at 50% 0%, var(--spot), transparent 65%),
    var(--solid);

<script>
const C = JSON.parse(document.getElementById('site-content').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

let current = 'all';

/* ---------- قیمت (با قیمت قبل از تخفیف خط‌خورده) ---------- */
function priceHtml(it, unit) {
  if (it.price == null) return '';
  const old = it.old != null ? `<s class="old">${fa(it.old)}</s>` : '';
  return `${old}${fa(it.price)} <small>${esc(unit || C.currency)}</small>`;
}

/* ---------- اسلایدر ---------- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const ICON_RIGHT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const ICON_LEFT  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';

let slideIdx = 0, slideCount = 0, slideTimer = null;

function showSlide(i) {
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  if (!slides.length) return;
  slideIdx = ((i % slideCount) + slideCount) % slideCount;
  slides.forEach((s, k) => s.classList.toggle('on', k === slideIdx));
  dots.forEach((d, k) => d.classList.toggle('on', k === slideIdx));
}

function startSlider() {
  clearInterval(slideTimer);
  if (slideCount > 1) {
    slideTimer = setInterval(() => showSlide(slideIdx + 1), 5000);
  }
}

function renderSlider() {
  const cat = C.categories.find(c => c.id === C.slider.category);
  const items = cat ? shuffle(cat.items) : [];
  if (!items.length) { $('#slider').innerHTML = ''; return; }

  slideCount = items.length;
  slideIdx = 0;
  /* ترتیب در DOM برای RTL: اولی سمت راست، آخری سمت چپ */
  $('#slider').innerHTML = `
    <h2>${esc(C.slider.title)}</h2>
    <div class="slides">
      ${items.map(it => `
        <article class="slide">
          <div class="eyebrow">${esc(cat.label)}</div>
          <div class="t">${esc(it.title)}</div>
          ${it.sub ? `<div class="d">${esc(it.sub)}</div>` : `<div class="d">${esc(C.slider.text)}</div>`}
          <div class="row">
            <div class="pr">${priceHtml(it, it.unit)}</div>
            <a class="go" href="${esc(it.link || C.bot)}" target="_blank" rel="noopener">${esc(it.cta || cat.cta || 'خرید در ربات')}</a>
          </div>
        </article>`).join('')}
    </div>
    <div class="ctrl">
      <button class="arr" type="button" data-dir="-1" aria-label="اسلاید قبلی">${ICON_RIGHT}</button>
      <div class="dots">
        ${items.map((_, i) => `<button class="dot" type="button" data-i="${i}" aria-label="اسلاید ${fa(i + 1)}"></button>`).join('')}
      </div>
      <button class="arr" type="button" data-dir="1" aria-label="اسلاید بعدی">${ICON_LEFT}</button>
    </div>`;

  showSlide(0);
  startSlider();
}

/* کشیدن با انگشت یا ماوس: کشیدن به چپ = اسلاید بعدی، کشیدن به راست = قبلی */
let dragX = null, dragY = null, dragged = false;
const sliderEl = $('#slider');

sliderEl.addEventListener('pointerdown', e => {
  if (!e.target.closest('.slides')) return;
  dragX = e.clientX;
  dragY = e.clientY;
  dragged = false;
  clearInterval(slideTimer);
});

sliderEl.addEventListener('pointerup', e => {
  if (dragX === null) return;
  const dx = e.clientX - dragX;
  const dy = e.clientY - dragY;
  dragX = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
    dragged = true; // جلوگیری از باز شدن لینک بعد از کشیدن
    showSlide(dx < 0 ? slideIdx + 1 : slideIdx - 1);
  }
  startSlider();
});

sliderEl.addEventListener('pointercancel', () => {
  dragX = null;
  startSlider();
});

sliderEl.addEventListener('click', e => {
  if (dragged) {
    dragged = false;
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  const arr = e.target.closest('.arr');
  if (arr) {
    showSlide(slideIdx + Number(arr.dataset.dir));
    startSlider();
    return;
  }
  const dot = e.target.closest('.dot');
  if (dot) {
    showSlide(Number(dot.dataset.i));
    startSlider();
  }
});

/* ---------- ساخت بخش‌ها ---------- */
function setStatic() {
  document.title = C.brand.name + ' ' + C.brand.sub;
  $('#brand').innerHTML = `${esc(C.brand.name)} <span>${esc(C.brand.sub)}</span>`;
  $('#cta').href = C.bot;
  $('#hero-title').textContent = C.hero.title;
  $('#hero-text').textContent = C.hero.text;
  $('#hero-badges').innerHTML = C.hero.badges.map(b => `<span>${esc(b)}</span>`).join('');
  $('#footer-text').textContent = C.footerText;
  $('#footer-links').innerHTML = C.footerLinks
    .map(l => `<a href="${esc(l.link)}" target="_blank" rel="noopener">${esc(l.label)}</a>`)
    .join(' &nbsp;·&nbsp; ');
}

function renderDock() {
  $('#dock').innerHTML = C.dock.map((d, i) => {
    const cls = d.main ? 'main' : '';
    const inner = `<span class="ico">${esc(d.icon)}</span><span>${esc(d.label)}</span>`;
    if (d.panel) {
      return `<button type="button" class="${cls}" data-panel="${i}">${inner}</button>`;
    }
    const ext = d.link.startsWith('#') ? '' : 'target="_blank" rel="noopener"';
    return `<a href="${esc(d.link)}" class="${cls}" ${ext}>${inner}</a>`;
  }).join('');
}

function renderTabs() {
  const tabs = [{ id: 'all', label: 'همه‌ی محصولات' }, ...C.categories.map(c => ({ id: c.id, label: c.label }))];
  $('#tabs').innerHTML = tabs.map(t =>
    `<button type="button" data-id="${esc(t.id)}" aria-pressed="${t.id === current}">${esc(t.label)}</button>`
  ).join('');
}

function card(it, cat) {
  const link = it.link || C.bot;
  return `
    <article class="card">
      ${it.badge ? `<span class="badge">${esc(it.badge)}</span>` : ''}
      <div class="title">${esc(it.title)}</div>
      ${it.sub ? `<div class="sub">${esc(it.sub)}</div>` : ''}
      <div class="price">${priceHtml(it, it.unit)}</div>
      <a class="buy" href="${esc(link)}" target="_blank" rel="noopener">${esc(it.cta || cat.cta || 'خرید در ربات')}</a>
    </article>`;
}

function renderCatalog() {
  const q = $('#q').value.trim().toLowerCase();
  let html = '';
  for (const c of C.categories) {
    if (current !== 'all' && current !== c.id) continue;
    const items = c.items.filter(it =>
      !q || (it.title + ' ' + (it.sub || '')).toLowerCase().includes(q));
    if (!items.length) continue;
    html += `
      <section class="group" id="${esc(c.id)}">
        <h2>${esc(c.label)}</h2>
        ${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
        <div class="grid">${items.map(it => card(it, c)).join('')}</div>
      </section>`;
  }
  $('#catalog').innerHTML = html || `<p class="empty">${esc(C.emptyText)}</p>`;
}

/* ---------- پنل ---------- */
function openPanel(i) {
  const p = C.dock[i].panel;
  $('#sheet-title').textContent = p.title;
  $('#sheet-text').textContent = p.text;
  $('#sheet-btns').innerHTML = p.buttons.map(b =>
    `<a class="sbtn" href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.label)}</a>`
  ).join('');
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
}

function closePanel() {
  $('#sheet').hidden = true;
  document.body.style.overflow = '';
}

/* ---------- رویدادها ---------- */
$('#dock').addEventListener('click', e => {
  const b = e.target.closest('button[data-panel]');
  if (b) openPanel(Number(b.dataset.panel));
});

$('#sheet').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) closePanel();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closePanel();
});

$('#tabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-id]');
  if (!btn) return;
  current = btn.dataset.id;
  renderTabs();
  renderCatalog();
});

$('#q').addEventListener('input', renderCatalog);

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('vexon-theme', t); } catch (e) {}
  $('#theme').textContent = t === 'dark' ? '☀️' : '🌙';
}
$('#theme').addEventListener('click', () =>
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

/* لینک‌های t.me داخل خود تلگرام باز شوند */
const tg = window.Telegram && window.Telegram.WebApp;
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="https://t.me/"]');
  if (!a || !tg || !tg.openTelegramLink) return;
  e.preventDefault();
  tg.openTelegramLink(a.href);
});

/* لینک‌های داخلی (#top) نرم اسکرول شوند */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href="#top"]');
  if (!a) return;
  e.preventDefault();
  closePanel();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

if (tg) { tg.ready(); tg.expand(); }

/* ---------- شروع ---------- */
setStatic();
applyTheme(document.documentElement.dataset.theme);
renderSlider();
renderDock();
renderTabs();
renderCatalog();
</script>
</body>
</html>
